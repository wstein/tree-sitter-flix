name: CI

on:
  push:
    branches:
      - main
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - scripts/**
      - binding.gyp
      - package.json
      - package-lock.json
      - eslint.config.js
      - tree-sitter.json
      - .tsqueryrc.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - scripts/**
      - binding.gyp
      - package.json
      - package-lock.json
      - eslint.config.js
      - tree-sitter.json
      - .tsqueryrc.json
      - .github/workflows/ci.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}
          # This action regenerates the parser and diffs src/parser.c by
          # default. Generation takes ~10 minutes for this grammar, which would
          # be paid on every OS in the matrix; the check runs once on Linux
          # instead, in the separate `generate` job below.
          generate: false

  lint:
    name: Lint grammar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint

  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-check
        shell: sh
        run: |-
          # Not `$_`: this runs under dash, which does not set it, so the old
          # form passed an empty pathspec and reported "changed" every run.
          if [ -f src/scanner.c ] && ! git diff --quiet HEAD^ -- src/scanner.c; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build parser
        run: tree-sitter build

      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/download/v3.16.0/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz

      - name: Check queries
        run: ./ts_query_ls check -f queries/

  generate:
    name: Check parser is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Regenerate parser
        run: tree-sitter generate
      - name: Fail if the committed parser differs
        run: git diff --exit-code src/parser.c src/grammar.json src/node-types.json
